<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030706"><title>Meet SAMI · Ask SAMI</title><link rel="icon" href="icon-192.f8bcaf6fed.png"><style>
:root{--g:#61ff9a;--c:#55e9e6;--ink:#eaf5ef;--mut:#8ba49a;--bg:#020504}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 50%,rgba(48,255,132,.075),transparent 32%),radial-gradient(circle at 20% 70%,rgba(55,227,223,.04),transparent 26%);filter:blur(35px);animation:haze 13s ease-in-out infinite alternate}@keyframes haze{to{transform:translate3d(5%,-3%,0) scale(1.08)}}
#film{position:fixed;inset:0;display:grid;place-items:center}.stage{position:absolute;inset:0}.network{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:drop-shadow(0 0 7px rgba(74,255,143,.38));transition:opacity 1s}.network.on{opacity:1}.network.dim{opacity:.23;filter:grayscale(.8) drop-shadow(0 0 2px rgba(110,130,120,.2))}.edge{stroke:url(#line);stroke-width:1.15;fill:none;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .8s forwards}.node{opacity:0;animation:pop .45s forwards}.node circle,.node rect{fill:#07110d;stroke:#49e987;stroke-width:1.2}.node text{fill:#dff8e8;font-size:12px;letter-spacing:.04em;text-anchor:middle}.node .small{font-size:9px;fill:#92bba3}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}.center circle{stroke-width:2;filter:drop-shadow(0 0 10px rgba(75,255,145,.7))}.center text{font-weight:700;font-size:15px}
.caption{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);width:min(820px,88vw);text-align:center;font-size:clamp(20px,3vw,40px);font-weight:520;letter-spacing:-.02em;line-height:1.14;opacity:0;transition:opacity .55s,transform .55s}.caption.show{opacity:1;transform:translate(-50%,-6px)}.caption .sub{display:block;margin-top:10px;color:var(--mut);font-size:.45em;letter-spacing:.08em;text-transform:uppercase;font-weight:600}.question{font-size:clamp(25px,4vw,54px)}
#reveal{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .9s;background:radial-gradient(circle at center,rgba(30,255,115,.11),transparent 30%)}#reveal.show{opacity:1;pointer-events:auto}.brand{text-align:center}.brand img{width:min(440px,68vw);max-height:145px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(70,255,140,.28))}.ask{margin:28px auto 0;border:1px solid rgba(99,255,157,.55);background:linear-gradient(180deg,rgba(21,54,37,.82),rgba(7,18,13,.92));color:#effff5;border-radius:999px;padding:17px 34px;font-size:18px;font-weight:720;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 0 1px rgba(87,255,148,.07) inset,0 0 35px rgba(66,255,137,.14);cursor:pointer;animation:breathe 3.8s ease-in-out infinite}.ask:hover{box-shadow:0 0 50px rgba(66,255,137,.27)}@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(87,255,148,.1) inset,0 0 48px rgba(66,255,137,.22)}}.credit{margin-top:24px;color:#668276;font-size:10px;letter-spacing:.22em;text-transform:uppercase}.credit b{color:#a9c3b6;font-size:12px}.skip{position:absolute;top:max(18px,env(safe-area-inset-top));right:22px;border:0;background:transparent;color:#61766d;font-size:12px;letter-spacing:.1em;text-transform:uppercase;z-index:5}.sound{position:absolute;top:max(18px,env(safe-area-inset-top));left:22px;border:1px solid rgba(150,180,165,.15);background:rgba(3,9,6,.55);color:#8ca59a;border-radius:99px;padding:8px 11px;z-index:5}.surge{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at center,rgba(133,255,180,.9) 0,rgba(69,255,140,.18) 11%,transparent 36%);mix-blend-mode:screen}.surge.go{animation:surge .9s ease-out}@keyframes surge{0%{opacity:0;transform:scale(.15)}25%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
@media(max-width:700px){.node text{font-size:9px}.node .small{font-size:7px}.caption{bottom:11vh}.brand img{width:74vw}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main id="film"><button class="sound" id="sound">Sound on</button><button class="skip" id="skip">Skip</button><div class="stage"><svg class="network" id="network" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="line"><stop stop-color="#36d77b"/><stop offset="1" stop-color="#4adfd7"/></linearGradient></defs><g id="edges"></g><g id="nodes"></g></svg><div class="surge" id="surge"></div><div class="caption" id="caption"></div></div><section id="reveal"><div class="brand"><img src="sami-wordmark.eb168c8e3c.png" alt="SAMI"><button class="ask" id="ask">Ask SAMI</button><div class="credit">Design &amp; production by<br><b>JW EDS DESIGNS</b></div></div></section><audio id="bed" src="sami-intro.1c4c23273f.mp3" preload="auto" loop></audio></main><script>
const data=[
['Site visit',235,165],['Photographs',110,270],['Notes',235,360],['Service data',175,520],['External sources',350,585],['Site checks',475,605],['Internal teams',760,145],['External teams',875,250],['Draft summary',795,355],['CAD designer',875,470],['Review',710,545],['Amend',585,605],['Approval',910,610],['Time',90,115],['Cost',900,100],['Travel',75,610],['Environmental impact',500,90],['Project change',500,640]
]; const center=[500,350]; const svgNS='http://www.w3.org/2000/svg', edges=document.getElementById('edges'),nodes=document.getElementById('nodes');
function line(x,y,i){let p=document.createElementNS(svgNS,'path');p.setAttribute('class','edge');p.setAttribute('pathLength','100');p.setAttribute('d',`M${center[0]},${center[1]} Q${(center[0]+x)/2+(i%2?25:-25)},${(center[1]+y)/2} ${x},${y}`);p.style.animationDelay=(i*.07)+'s';edges.appendChild(p)}
function node(label,x,y,i){let g=document.createElementNS(svgNS,'g');g.setAttribute('class','node');g.style.animationDelay=(.3+i*.07)+'s';let r=document.createElementNS(svgNS,'rect');let w=Math.max(88,label.length*7+24);r.setAttribute('x',x-w/2);r.setAttribute('y',y-19);r.setAttribute('width',w);r.setAttribute('height',38);r.setAttribute('rx',19);let t=document.createElementNS(svgNS,'text');t.setAttribute('x',x);t.setAttribute('y',y+4);t.textContent=label;g.append(r,t);nodes.appendChild(g)}
data.forEach((d,i)=>{line(d[1],d[2],i);node(...d,i)});let cg=document.createElementNS(svgNS,'g');cg.setAttribute('class','node center');cg.innerHTML='<circle cx="500" cy="350" r="66"/><text x="500" y="345">SITE PLAN</text><text class="small" x="500" y="367">CURRENT PROCESS</text>';nodes.appendChild(cg);
const cap=document.getElementById('caption'),net=document.getElementById('network'),rev=document.getElementById('reveal'),surge=document.getElementById('surge'),bed=document.getElementById('bed');let timers=[];function at(ms,fn){timers.push(setTimeout(fn,ms))}function say(html){cap.classList.remove('show');setTimeout(()=>{cap.innerHTML=html;cap.classList.add('show')},180)}function run(){net.className.baseVal='network on';say('A lot goes into creating one site plan.<span class="sub">Different information · different sources · different people</span>');at(6500,()=>say('Site visits. Photographs. Notes. Services. Checks.'));at(12000,()=>say('Draft. CAD. Review. Amend. Review again. Approve.'));at(18500,()=>say('And when the project changes…<br>parts of the process begin again.'));at(24500,()=>say('Time. Cost. Travel. Duplication.<br>Environmental impact.'));at(30500,()=>{net.className.baseVal='network on dim';say('<span class="question">What if all of this could become simpler?</span>')});at(35500,()=>say('One process. &nbsp; One team.<br>One source of information. &nbsp; One tool.'));at(41500,()=>say('It’s time to work smarter.'));at(45000,()=>{say('It’s time to <strong>Ask SAMI.</strong>');surge.classList.add('go')});at(47000,finish)}function finish(){timers.forEach(clearTimeout);cap.classList.remove('show');net.style.opacity='0';setTimeout(()=>rev.classList.add('show'),300)}
document.getElementById('skip').onclick=finish;document.getElementById('ask').onclick=()=>{location.href='index.html'};document.getElementById('sound').onclick=async e=>{if(bed.paused){try{bed.volume=.22;await bed.play();e.target.textContent='Sound off'}catch{}}else{bed.pause();e.target.textContent='Sound on'}};addEventListener('pointerdown',()=>{if(bed.paused){bed.volume=.22;bed.play().catch(()=>{})}},{once:true});run();
</script></body></html>
